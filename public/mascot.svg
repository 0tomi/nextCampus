<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradiente para el cuerpo del búho (UADER FCyT Blue) -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E5A8F" /> <!-- UADER Blue Light -->
      <stop offset="100%" stop-color="#002D5A" /> <!-- UADER Blue Dark -->
    </linearGradient>

    <!-- Gradiente para la pancita -->
    <linearGradient id="bellyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Gradiente para el Birrete (Negro Metálico Premium) -->
    <linearGradient id="capBoardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F3F46" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Gradiente para el pico y detalles (UADER Crimson Red) -->
    <linearGradient id="beakGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" /> <!-- Red-500 -->
      <stop offset="100%" stop-color="#B91C1C" /> <!-- UADER Red -->
    </linearGradient>

    <!-- Filtro de Sombra Suave para la Mascota -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    /* Estilos e Animaciones CSS */
    
    /* 1. Animación de Respiración Orgánica (mantiene los pies en los libros) */
    .floating-mascot {
      transform-origin: 200px 328px;
      animation: mascot-breath 4s infinite ease-in-out;
    }
    
    @keyframes mascot-breath {
      0%, 100% {
        transform: scale(1) translateY(0px);
      }
      50% {
        transform: scaleX(0.98) scaleY(1.02) translateY(-2px);
      }
    }

    /* 2. Animación de parpadeo (Blink) - Doble parpadeo rápido cada 4s */
    .blink-eye-left {
      transform-origin: 148px 180px;
      animation: eye-blink 4s infinite ease-in-out, eye-hide 6s infinite ease-in-out;
    }
    
    .blink-eye-right {
      transform-origin: 252px 180px;
      animation: eye-blink 4s infinite ease-in-out, eye-hide 6s infinite ease-in-out;
    }

    @keyframes eye-blink {
      0%, 88%, 92%, 96%, 100% {
        transform: scaleY(1);
      }
      90%, 94% {
        transform: scaleY(0.08);
      }
    }

    /* Ocultar los ojos normales cuando sonríe */
    @keyframes eye-hide {
      0%, 42%, 63%, 100% {
        opacity: 1;
      }
      47%, 58% {
        opacity: 0;
      }
    }

    /* 3. Ojos Felices de Sonrisa (^ ^) */
    .happy-eye-left {
      transform-origin: 148px 180px;
      opacity: 0;
      animation: eye-show 6s infinite ease-in-out;
    }

    .happy-eye-right {
      transform-origin: 252px 180px;
      opacity: 0;
      animation: eye-show 6s infinite ease-in-out;
    }

    @keyframes eye-show {
      0%, 42%, 63%, 100% {
        opacity: 0;
        transform: scale(0.7);
      }
      47%, 58% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* 4. Mejillas Sonrojadas */
    .cheek-blush-left {
      transform-origin: 108px 210px;
      animation: cheek-pulse 6s infinite ease-in-out;
    }

    .cheek-blush-right {
      transform-origin: 292px 210px;
      animation: cheek-pulse 6s infinite ease-in-out;
    }

    @keyframes cheek-pulse {
      0%, 42%, 63%, 100% {
        opacity: 0.25;
        transform: scale(1);
      }
      47%, 58% {
        opacity: 0.75;
        transform: scale(1.3);
      }
    }

    /* 5. Alitas aleteando suavemente */
    .left-wing {
      transform-origin: 95px 190px;
      animation: wing-flap-left 4s infinite ease-in-out;
    }

    .right-wing {
      transform-origin: 305px 190px;
      animation: wing-flap-right 4s infinite ease-in-out;
    }

    @keyframes wing-flap-left {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }

    @keyframes wing-flap-right {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
    }

    /* 6. Borla del birrete */
    .tassel-sway {
      transform-origin: 280px 120px;
      animation: tassel-wiggle 3s infinite ease-in-out;
    }

    @keyframes tassel-wiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(10deg); }
    }
  </style>

  <!-- 1. Sombra del piso para la pila de libros -->
  <ellipse cx="200" cy="396" rx="135" ry="4" fill="#000000" opacity="0.25" />

  <!-- 2. Pila de Libros Académicos (Estática en la base) -->
  <g>
    <!-- Libro Inferior (Amber/Gold - Representa el gradiente académico) -->
    <g>
      <!-- Tapa inferior -->
      <rect x="75" y="372" width="250" height="24" rx="4" fill="#D97706" />
      <!-- Lomo brillante -->
      <rect x="75" y="372" width="250" height="5" rx="2" fill="#FBBF24" />
      <!-- Franjas decorativas del lomo -->
      <rect x="100" y="377" width="6" height="19" fill="#1E293B" opacity="0.25" />
      <rect x="112" y="377" width="6" height="19" fill="#1E293B" opacity="0.25" />
      <rect x="290" y="377" width="6" height="19" fill="#1E293B" opacity="0.25" />
    </g>

    <!-- Libro Medio (UADER Blue - Representa la facultad) -->
    <g transform="rotate(-1, 200, 361)">
      <!-- Tapa inferior -->
      <rect x="85" y="350" width="230" height="22" rx="3" fill="#002D5A" />
      <!-- Lomo brillante -->
      <rect x="85" y="350" width="230" height="5" rx="1.5" fill="#1E5A8F" />
      <!-- Franjas decorativas del lomo -->
      <rect x="115" y="355" width="5" height="17" fill="#FFFBEB" opacity="0.2" />
      <rect x="125" y="355" width="5" height="17" fill="#FFFBEB" opacity="0.2" />
      <rect x="275" y="355" width="5" height="17" fill="#FFFBEB" opacity="0.2" />
    </g>

    <!-- Libro Superior (UADER Red - Representa el campus) -->
    <g transform="rotate(1.5, 200, 340)">
      <!-- Tapa inferior -->
      <rect x="110" y="330" width="180" height="20" rx="3" fill="#B91C1C" />
      <!-- Lomo brillante -->
      <rect x="110" y="330" width="180" height="4" rx="1" fill="#EF4444" />
      <!-- Etiqueta blanca de biblioteca en el lomo -->
      <rect x="165" y="336" width="70" height="9" rx="1.5" fill="#F8FAFC" opacity="0.85" />
      <!-- Franjas decorativas doradas -->
      <rect x="135" y="334" width="4" height="16" fill="#FBBF24" />
      <rect x="260" y="334" width="4" height="16" fill="#FBBF24" />
    </g>
  </g>

  <!-- 3. Grupo Principal de la Mascota con Sombra Filtro y Respiración -->
  <g class="floating-mascot" filter="url(#soft-shadow)">
    
    <!-- Orejitas del Búho (Tufts) -->
    <path d="M 110 120 L 70 85 L 140 108 Z" fill="url(#bodyGradient)" />
    <path d="M 290 120 L 330 85 L 260 108 Z" fill="url(#bodyGradient)" />

    <!-- Patitas Lindas apoyadas en el libro superior (UADER Red) -->
    <!-- Pata Izquierda -->
    <g>
      <ellipse cx="155" cy="328" rx="10" ry="6" fill="#CC0000" />
      <ellipse cx="165" cy="328" rx="10" ry="6" fill="#CC0000" />
      <ellipse cx="145" cy="326" rx="9" ry="6" fill="#990000" />
    </g>
    <!-- Pata Derecha -->
    <g>
      <ellipse cx="235" cy="328" rx="10" ry="6" fill="#CC0000" />
      <ellipse cx="245" cy="328" rx="10" ry="6" fill="#CC0000" />
      <ellipse cx="255" cy="326" rx="9" ry="6" fill="#990000" />
    </g>

    <!-- Cuerpo Redondito/Cachón (Capsule) -->
    <rect x="90" y="110" width="220" height="220" rx="110" ry="110" fill="url(#bodyGradient)" />

    <!-- Pancita de color crema/blanco suave -->
    <ellipse cx="200" cy="245" rx="75" ry="60" fill="url(#bellyGradient)" />

    <!-- Alitas Felices -->
    <!-- Ala Izquierda -->
    <path class="left-wing" d="M 95 190 C 65 190, 45 230, 75 260 C 90 270, 105 240, 105 210 Z" fill="url(#bodyGradient)" />
    <!-- Ala Derecha -->
    <path class="right-wing" d="M 305 190 C 335 190, 355 230, 325 260 C 310 270, 295 240, 295 210 Z" fill="url(#bodyGradient)" />

    <!-- Parches del contorno de ojos estilo Búho Anime -->
    <ellipse cx="148" cy="180" rx="42" ry="46" fill="#FFFBEB" opacity="0.95" />
    <ellipse cx="252" cy="180" rx="42" ry="46" fill="#FFFBEB" opacity="0.95" />

    <!-- Mejillas Sonrosadas (Blush) -->
    <circle class="cheek-blush-left" cx="108" cy="210" r="10" fill="#F87171" opacity="0.25" />
    <circle class="cheek-blush-right" cx="292" cy="210" r="10" fill="#F87171" opacity="0.25" />

    <!-- Pico Tierno -->
    <polygon points="200,186 212,200 200,212 188,200" fill="url(#beakGradient)" />

    <!-- Boca / Sonrisa Morfeable (SMIL Animation) -->
    <path d="M 192 212 Q 200 215 208 212" fill="none" stroke="#990000" stroke-width="3" stroke-linecap="round">
      <animate 
        attributeName="d" 
        dur="6s" 
        repeatCount="indefinite"
        values="M 192 212 Q 200 215 208 212; 
                M 192 212 Q 200 215 208 212; 
                M 186 210 Q 200 230 214 210; 
                M 192 212 Q 200 215 208 212"
        keyTimes="0; 0.42; 0.47; 1" />
    </path>

    <!-- Ojos Que Parpadean (Pupilas + Brillos) -->
    <!-- Ojo Izquierdo -->
    <g class="blink-eye-left">
      <circle cx="148" cy="180" r="26" fill="#0F172A" />
      <circle cx="138" cy="170" r="8" fill="#FFFFFF" />
      <circle cx="158" cy="190" r="4" fill="#FFFFFF" />
    </g>
    <!-- Ojo Derecho -->
    <g class="blink-eye-right">
      <circle cx="252" cy="180" r="26" fill="#0F172A" />
      <circle cx="242" cy="170" r="8" fill="#FFFFFF" />
      <circle cx="262" cy="190" r="4" fill="#FFFFFF" />
    </g>

    <!-- Ojos Felices que se muestran al sonreír (Inverted Arcs ^ ^) -->
    <!-- Ojo Izquierdo Feliz -->
    <path class="happy-eye-left" d="M 130 185 Q 148 160 166 185" fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round" />
    <!-- Ojo Derecho Feliz -->
    <path class="happy-eye-right" d="M 234 185 Q 252 160 270 185" fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round" />

    <!-- Birrete (Sombrero de Egresado adaptado a colores de la UADER FCyT) -->
    <!-- Base del Birrete -->
    <path d="M 148 92 L 148 112 C 148 126, 252 126, 252 112 L 252 92 Z" fill="#18181B" />
    <path d="M 152 112 C 152 120, 248 120, 248 112" fill="none" stroke="#27272A" stroke-width="1.5" />
    
    <!-- Rombo de arriba del Birrete -->
    <polygon points="200,55 310,85 200,115 90,85" fill="url(#capBoardGradient)" stroke="#27272A" stroke-width="1.5" />

    <!-- Botón UADER Crimson Red del Centro -->
    <circle cx="200" cy="85" r="6" fill="#EF4444" />

    <!-- Cinta UADER Crimson Red -->
    <path d="M 200 85 Q 265 92 280 120" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />

    <!-- Borla/Tassel Colgante UADER Red -->
    <path class="tassel-sway" d="M 280 120 L 275 145 C 275 150, 285 150, 285 145 Z" fill="#B91C1C" />

  </g>
</svg>
