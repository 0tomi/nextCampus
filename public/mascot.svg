<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradiente para el cuerpo del búho (Branding del Campus) -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" /> <!-- Amber-400 -->
      <stop offset="100%" stop-color="#F97316" /> <!-- Orange-500 -->
    </linearGradient>

    <!-- Gradiente para la pancita -->
    <linearGradient id="bellyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Gradiente para el Birrete (Negro Premium Metálico) -->
    <linearGradient id="capBoardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F3F46" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Gradiente para el pico -->
    <linearGradient id="beakGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Filtro de Sombra Suave (Efecto Floating 3D) -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    /* Estilos e Animaciones CSS */
    
    /* 1. Animación de flotado para todo el búho */
    .floating-mascot {
      animation: mascot-float 5s infinite ease-in-out;
    }
    
    @keyframes mascot-float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    /* 2. Animación de la Sombra del piso (sincronizada con el flotado) */
    .floor-shadow {
      transform-origin: 200px 360px;
      animation: shadow-scale 5s infinite ease-in-out;
    }

    @keyframes shadow-scale {
      0%, 100% {
        transform: scale(1);
        opacity: 0.15;
      }
      50% {
        transform: scale(0.85);
        opacity: 0.08;
      }
    }

    /* 3. Animación de parpadeo (Blink) - Doble parpadeo rápido cada 4s */
    .blink-eye-left {
      transform-origin: 148px 180px;
      animation: eye-blink 4s infinite ease-in-out, eye-hide 6s infinite ease-in-out;
    }
    
    .blink-eye-right {
      transform-origin: 252px 180px;
      animation: eye-blink 4s infinite ease-in-out, eye-hide 6s infinite ease-in-out;
    }

    @keyframes eye-blink {
      0%, 88%, 92%, 96%, 100% {
        transform: scaleY(1);
      }
      90%, 94% {
        transform: scaleY(0.08);
      }
    }

    /* Ocultar los ojos normales cuando sonríe */
    @keyframes eye-hide {
      0%, 42%, 63%, 100% {
        opacity: 1;
      }
      47%, 58% {
        opacity: 0;
      }
    }

    /* 4. Ojos Felices de Sonrisa (^ ^) - Aparecen coordinados con la boca */
    .happy-eye-left {
      transform-origin: 148px 180px;
      opacity: 0;
      animation: eye-show 6s infinite ease-in-out;
    }

    .happy-eye-right {
      transform-origin: 252px 180px;
      opacity: 0;
      animation: eye-show 6s infinite ease-in-out;
    }

    @keyframes eye-show {
      0%, 42%, 63%, 100% {
        opacity: 0;
        transform: scale(0.7);
      }
      47%, 58% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* 5. Mejillas Sonrojadas que se iluminan al sonreír */
    .cheek-blush-left {
      transform-origin: 108px 210px;
      animation: cheek-pulse 6s infinite ease-in-out;
    }

    .cheek-blush-right {
      transform-origin: 292px 210px;
      animation: cheek-pulse 6s infinite ease-in-out;
    }

    @keyframes cheek-pulse {
      0%, 42%, 63%, 100% {
        opacity: 0.25;
        transform: scale(1);
      }
      47%, 58% {
        opacity: 0.75;
        transform: scale(1.3);
      }
    }

    /* 6. Alitas saludando/aleteando suavemente */
    .left-wing {
      transform-origin: 95px 190px;
      animation: wing-flap-left 4s infinite ease-in-out;
    }

    .right-wing {
      transform-origin: 305px 190px;
      animation: wing-flap-right 4s infinite ease-in-out;
    }

    @keyframes wing-flap-left {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }

    @keyframes wing-flap-right {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
    }

    /* 7. Borla del birrete que se mece libremente */
    .tassel-sway {
      transform-origin: 280px 120px;
      animation: tassel-wiggle 3s infinite ease-in-out;
    }

    @keyframes tassel-wiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(10deg); }
    }
  </style>

  <!-- 1. Sombra del piso (Fuera del grupo flotante para efecto 3D) -->
  <ellipse class="floor-shadow" cx="200" cy="360" rx="75" ry="10" fill="#000000" opacity="0.15" />

  <!-- 2. Grupo Principal de la Mascota con Sombra Filtro y Flotado -->
  <g class="floating-mascot" filter="url(#soft-shadow)">
    
    <!-- Orejitas del Búho (Tufts) -->
    <path d="M 110 120 L 70 85 L 140 108 Z" fill="url(#bodyGradient)" />
    <path d="M 290 120 L 330 85 L 260 108 Z" fill="url(#bodyGradient)" />

    <!-- Patitas Lindas -->
    <!-- Pata Izquierda -->
    <g>
      <ellipse cx="155" cy="328" rx="10" ry="6" fill="#F97316" />
      <ellipse cx="165" cy="328" rx="10" ry="6" fill="#F97316" />
      <ellipse cx="145" cy="326" rx="9" ry="6" fill="#EA580C" />
    </g>
    <!-- Pata Derecha -->
    <g>
      <ellipse cx="235" cy="328" rx="10" ry="6" fill="#F97316" />
      <ellipse cx="245" cy="328" rx="10" ry="6" fill="#F97316" />
      <ellipse cx="255" cy="326" rx="9" ry="6" fill="#EA580C" />
    </g>

    <!-- Cuerpo Redondito/Cachón (Capsule) -->
    <rect x="90" y="110" width="220" height="220" rx="110" ry="110" fill="url(#bodyGradient)" />

    <!-- Pancita de color crema -->
    <ellipse cx="200" cy="245" rx="75" ry="60" fill="url(#bellyGradient)" />

    <!-- Alitas Felices -->
    <!-- Ala Izquierda -->
    <path class="left-wing" d="M 95 190 C 65 190, 45 230, 75 260 C 90 270, 105 240, 105 210 Z" fill="url(#bodyGradient)" />
    <!-- Ala Derecha -->
    <path class="right-wing" d="M 305 190 C 335 190, 355 230, 325 260 C 310 270, 295 240, 295 210 Z" fill="url(#bodyGradient)" />

    <!-- Parches del contorno de ojos estilo Búho Anime -->
    <ellipse cx="148" cy="180" rx="42" ry="46" fill="#FFFBEB" opacity="0.9" />
    <ellipse cx="252" cy="180" rx="42" ry="46" fill="#FFFBEB" opacity="0.9" />

    <!-- Mejillas Sonrosadas (Blush) -->
    <circle class="cheek-blush-left" cx="108" cy="210" r="10" fill="#F87171" opacity="0.25" />
    <circle class="cheek-blush-right" cx="292" cy="210" r="10" fill="#F87171" opacity="0.25" />

    <!-- Pico Tierno -->
    <polygon points="200,186 212,200 200,212 188,200" fill="url(#beakGradient)" />

    <!-- Boca / Sonrisa Morfeable (SMIL Animation) -->
    <path d="M 192 212 Q 200 215 208 212" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round">
      <animate 
        attributeName="d" 
        dur="6s" 
        repeatCount="indefinite"
        values="M 192 212 Q 200 215 208 212; 
                M 192 212 Q 200 215 208 212; 
                M 186 210 Q 200 230 214 210; 
                M 192 212 Q 200 215 208 212"
        keyTimes="0; 0.42; 0.47; 1" />
    </path>

    <!-- Ojos Que Parpadean (Pupilas + Brillos) -->
    <!-- Ojo Izquierdo -->
    <g class="blink-eye-left">
      <circle cx="148" cy="180" r="26" fill="#1E293B" />
      <circle cx="138" cy="170" r="8" fill="#FFFFFF" />
      <circle cx="158" cy="190" r="4" fill="#FFFFFF" />
    </g>
    <!-- Ojo Derecho -->
    <g class="blink-eye-right">
      <circle cx="252" cy="180" r="26" fill="#1E293B" />
      <circle cx="242" cy="170" r="8" fill="#FFFFFF" />
      <circle cx="262" cy="190" r="4" fill="#FFFFFF" />
    </g>

    <!-- Ojos Felices que se muestran al sonreír (Inverted Arcs ^ ^) -->
    <!-- Ojo Izquierdo Feliz -->
    <path class="happy-eye-left" d="M 130 185 Q 148 160 166 185" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round" />
    <!-- Ojo Derecho Feliz -->
    <path class="happy-eye-right" d="M 234 185 Q 252 160 270 185" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round" />

    <!-- Birrete (Sombrero de Egresado del Logo del Campus) -->
    <!-- Base del Birrete -->
    <path d="M 148 92 L 148 112 C 148 126, 252 126, 252 112 L 252 92 Z" fill="#18181B" />
    <path d="M 152 112 C 152 120, 248 120, 248 112" fill="none" stroke="#27272A" stroke-width="1.5" />
    
    <!-- Rombo de arriba del Birrete -->
    <polygon points="200,55 310,85 200,115 90,85" fill="url(#capBoardGradient)" stroke="#27272A" stroke-width="1.5" />

    <!-- Botón Dorado del Centro -->
    <circle cx="200" cy="85" r="6" fill="#FBBF24" />

    <!-- Cinta Amarilla -->
    <path d="M 200 85 Q 265 92 280 120" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />

    <!-- Borla/Tassel Colgante Naranja -->
    <path class="tassel-sway" d="M 280 120 L 275 145 C 275 150, 285 150, 285 145 Z" fill="#F97316" />

  </g>
</svg>
