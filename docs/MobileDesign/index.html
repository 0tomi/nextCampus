<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1600, initial-scale=1" />
<title>NextCampus · Mobile redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0a0a; color: #fff;
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  /* hide horizontal scrollbar on snap scrollers + pill rows */
  div::-webkit-scrollbar { display: none; }

  .canvas-title {
    font-family: "Sora", "Plus Jakarta Sans", system-ui, sans-serif;
    letter-spacing: -0.02em;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="mobile-shared.jsx"></script>
<script type="text/babel" src="mobile-screens.jsx"></script>
<script type="text/babel" src="mobile-calendar.jsx"></script>
<script type="text/babel" src="campus-app.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
  const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;
  const { IOSDevice } = window;
  const { CampusApp } = window;

  // Phone wrapper — black bezel, dark mode, no internal nav (we provide our own)
  function Phone({ initialScreen = 'home', initialSlug = '', initialDrawer = false, initialTab = 'calendario', initialSelectedDate = null }) {
    return (
      <IOSDevice width={402} height={874} dark>
        <div style={{
          position: 'absolute', inset: 0,
          // make room for status bar (44px) + dynamic island
          paddingTop: 44,
          background: '#0f0f0f',
        }}>
          <div style={{ width: '100%', height: 'calc(100% - 0px)', overflow: 'hidden', position: 'relative' }}>
            <CampusApp
              initialScreen={initialScreen}
              initialSlug={initialSlug}
              initialDrawer={initialDrawer}
              initialTab={initialTab}
              initialSelectedDate={initialSelectedDate}
            />
          </div>
        </div>
      </IOSDevice>
    );
  }

  // App
  function App() {
    return (
      <div style={{ width: '100%', height: '100vh', overflow: 'hidden' }}>
        <DesignCanvas>
          <DCSection
            id="overview"
            title="NextCampus · mobile redesign"
            subtitle="Topbar con menú + sidebar como drawer · año a año en carrusel horizontal · materias apiladas">

            <DCArtboard id="home" label="01 · Home / carrusel de años" width={440} height={920}>
              <Frame>
                <Phone initialScreen="home" />
              </Frame>
              <DCPostIt top={-12} left={-180} rotate={-3} width={170}>
                Hamburguesa abre el drawer. La grilla 5-cols del desktop se vuelve un carrusel paginado por año, con pill row arriba y dots abajo.
              </DCPostIt>
            </DCArtboard>

            <DCArtboard id="drawer" label="02 · Drawer / sidebar mobile" width={440} height={920}>
              <Frame>
                <Phone initialScreen="home" initialDrawer />
              </Frame>
              <DCPostIt top={-12} right={-180} rotate={2} width={180}>
                Sidebar lateral desplegable. Misma jerarquía que desktop: eyebrow CARRERA, título, lista de años con badge de color.
              </DCPostIt>
            </DCArtboard>

            <DCArtboard id="year" label="03 · Año · próximos eventos + materias" width={440} height={920}>
              <Frame>
                <Phone initialScreen="year" initialSlug="segundo-anio" />
              </Frame>
              <DCPostIt top={-12} left={-180} rotate={-2} width={170}>
                Hero gradient + pill switcher para rotar entre años. Sólo los 3 eventos más cercanos y un CTA grande "Ver calendario completo" que abre la vista 7.
              </DCPostIt>
            </DCArtboard>

            <DCArtboard id="materia" label="04 · Materia · tab Agenda + Calendario" width={440} height={920}>
              <Frame>
                <Phone initialScreen="materia" initialSlug="bases-de-datos" initialTab="calendario" />
              </Frame>
              <DCPostIt top={-12} right={-180} rotate={3} width={180}>
                Hero card con chip de año + Drive + tabs Agenda / Quiz / Apuntes. La tab Agenda muestra el calendario mensual mobile con grid de días.
              </DCPostIt>
            </DCArtboard>

            <DCArtboard id="materia-quiz" label="05 · Materia · tab Quiz" width={440} height={920}>
              <Frame>
                <Phone initialScreen="materia" initialSlug="bases-de-datos" initialTab="quiz" />
              </Frame>
              <DCPostIt top={-12} left={-180} rotate={-2} width={170}>
                Tab Quiz: bancos de preguntas seleccionables (checkbox tintado con el color del año) y CTA principal con el gradiente.
              </DCPostIt>
            </DCArtboard>

            <DCArtboard id="materia-apuntes" label="06 · Materia · tab Apuntes" width={440} height={920}>
              <Frame>
                <Phone initialScreen="materia" initialSlug="bases-de-datos" initialTab="apuntes" />
              </Frame>
              <DCPostIt top={-12} right={-180} rotate={2} width={180}>
                Tab Apuntes: cards apilados con badge PDF/Link contextual tintado al color del año.
              </DCPostIt>
            </DCArtboard>

            <DCArtboard id="calendar" label="07 · Calendario · todos los eventos del mes" width={440} height={920}>
              <Frame>
                <Phone initialScreen="calendar" initialSlug="segundo-anio" />
              </Frame>
              <DCPostIt top={-12} left={-180} rotate={-3} width={180}>
                Vista inicial del calendario: grid del mes con dots por evento, y abajo listado completo de todos los eventos del mes ordenados.
              </DCPostIt>
            </DCArtboard>

            <DCArtboard id="calendar-day" label="08 · Calendario · día seleccionado" width={440} height={920}>
              <Frame>
                <Phone initialScreen="calendar" initialSlug="segundo-anio" initialSelectedDate="2026-05-23T18:00:00" />
              </Frame>
              <DCPostIt top={-12} right={-180} rotate={2} width={180}>
                Al tocar un día: queda resaltado con el color del año y el listado de abajo filtra a los eventos de ese día. Pill "Ver mes" vuelve al estado completo.
              </DCPostIt>
            </DCArtboard>

          </DCSection>
        </DesignCanvas>
      </div>
    );
  }

  function Frame({ children }) {
    return (
      <div style={{
        width: '100%', height: '100%',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: 'transparent',
      }}>
        {children}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
