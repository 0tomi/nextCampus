plan: apuntes-recursos-y-playlist
meta:
  objetivo: |
    Reestructurar apuntes (rich text + múltiples recursos YouTube/Drive ordenables, sin PDFs)
    y agregar a la materia descripción editable real + botón Playlist de YouTube con toggle
    activo/inactivo. Endurecer seguridad (sanitización HTML + allowlist hosts + CSP).
  dominio: full-stack
  creado: 2026-05-20T14:30
  fases_totales: 8
  plan_origen: /home/tomi/.claude/plans/necesito-me-planifiques-la-woolly-lecun.md

restricciones:
  R1:
    titulo: Vocabulario UI user-friendly
    contenido: |
      El frontend NO debe exponer vocabulario técnico ni referencias a la infraestructura
      (Server Components, hooks, buckets, etc.). Mensajes de error y labels en lenguaje claro
      para estudiantes/admins. Todos los botones clickeables deben tener cursor-pointer.

  R2:
    titulo: Seguridad — sanitización y allowlist
    contenido: |
      Todo HTML que se persiste DEBE pasar por src/lib/sanitize.ts en el servidor antes del
      INSERT/UPDATE. Los recursos solo aceptan hostnames de YouTube y Drive (allowlist por
      hostname exacto, no por substring). Cada server action que mute datos debe llamar al
      helper de auth correspondiente (requireYearAdminForSubjectId / requireYearAdminForApunteId)
      antes de cualquier otra cosa.

  R3:
    titulo: Sin build
    contenido: |
      NUNCA correr `pnpm build` ni `next build` después de cambios. La validación se hace con
      `npx tsc --noEmit`, `pnpm lint`, `pnpm vitest run`, y verificación manual en `pnpm dev`
      (a cargo del usuario).

  R4:
    titulo: Estado actual del repo
    contenido: |
      - Prisma genera client en ./prisma/generated/client. Después de cada migración: `npx prisma generate`.
      - Apunte está vacía en BD (0 filas) — verificado via MCP Supabase. Se puede DROP sin migrar datos.
      - Modelo Subject ya tiene `descripcion` (default '') y `driveUrl` opcional. Faltan playlistUrl/playlistEnabled.
      - El hero en src/app/materia/[slug]/page.tsx línea ~170 tiene la descripción HARDCODEADA — hay que
        cambiarla por subject.descripcion.
      - sanitize.ts whitelist actual: p, br, strong, em, u, s, ul, ol, li, a, h2, h3, h4, blockquote, code, pre, span + href.
      - Patrón de auth: helpers requireYearAdminForSubjectId(subjectId), requireYearAdminForApunteId(apunteId)
        en src/lib/auth.ts. Devuelven Scope | null.
      - Patrón de modal admin: CustomEvent('open-admin-modal-{action}') desde SubjectPageAdminOverlay.

  R5:
    titulo: Decisiones tomadas con el humano
    contenido: |
      1. Rich text editor = Tiptap (@tiptap/react, @tiptap/pm, @tiptap/starter-kit, @tiptap/extension-link).
      2. ApunteRecurso = PK surrogate `id` (cuid) + UNIQUE(apunteId, orden). `orden` Int @db.SmallInt (Int2).
         Validar 0..255 en Zod. Reordenar = "delete all + insert all" en transacción.
      3. CSP: agregar frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com.
         No tocar frame-ancestors 'none' ni object-src 'none'.
      4. Recursos permitidos: solo YouTube y Drive (por ahora). Tipo enum RecursoTipo { YOUTUBE, DRIVE }.

fases:
  F1:
    nombre: Schema Prisma + migración + generate
    dominio: datos
    criticidad: critica
    objetivo: |
      Modificar prisma/schema.prisma: Subject gana playlistUrl (String?) y playlistEnabled
      (Boolean default false). Apunte se reescribe sin pdfObjectKey. Nuevo modelo ApunteRecurso
      con PK surrogate, UNIQUE(apunteId, orden), orden @db.SmallInt. Nuevo enum RecursoTipo.
      Generar migración SQL aplicable a Supabase con DROP TABLE Apunte (vacía) + CREATE de
      todo lo nuevo, habilitando RLS igual que migración 20260519221627.
      Correr `npx prisma generate` al final.
    archivos_alcance:
      permitidos:
        - prisma/schema.prisma
        - prisma/migrations/
      prohibidos:
        - src/
    criterio_cierre: |
      - schema.prisma compila (npx prisma format && npx prisma validate).
      - Migración generada como prisma/migrations/<timestamp>_apuntes_recursos_y_playlist/migration.sql.
      - Prisma Client regenerado (./prisma/generated/client incluye ApunteRecurso, RecursoTipo, playlistUrl, playlistEnabled).
      - La migración se aplicó en Supabase via MCP (mcp__supabase__apply_migration) y verificada con list_tables.
    dependencias: []
    estado: completada
    cierre:
      archivos_tocados:
        - prisma/schema.prisma
        - prisma/migrations/20260520143000_apuntes_recursos_y_playlist/migration.sql
        - prisma/generated/client/ (regenerado)
      supuestos:
        - Apunte tenía 0 filas en Supabase (verificado via SELECT COUNT antes del DROP).
        - @db.SmallInt mapea a SMALLINT en Postgres (confirmado por list_tables format=int2).
      deuda: []
      notas: |
        - Enum RecursoTipo accesible en TS como string literals 'YOUTUBE' / 'DRIVE'.
        - En queries: include: { recursos: { orderBy: { orden: 'asc' } } }.
        - playlistEnabled siempre boolean (no null) en queries completas.
      timestamp: 2026-05-20T14:50

  F2:
    nombre: lib/recursos.ts + sanitize endurecido + queries actualizadas
    dominio: backend
    criticidad: critica
    objetivo: |
      1. Crear src/lib/recursos.ts con:
         - tipo RecursoTipo = 'YOUTUBE' | 'DRIVE'
         - detectarRecurso(url): allowlist exacto de hostnames (youtube.com, www.youtube.com,
           m.youtube.com, youtu.be, drive.google.com, docs.google.com). Solo protocolo https.
         - extraerYoutubeId(url): soporta /watch?v=, youtu.be/<id>, /shorts/<id>, /embed/<id>.
         - youtubeEmbedUrl(id): retorna https://www.youtube-nocookie.com/embed/<id>.
      2. Tests Vitest en src/lib/recursos.test.ts cubriendo: URLs válidas YT/Drive, hostnames
         no permitidos (evil.com/youtube), protocolo http, IDs extraídos correctamente.
      3. Endurecer src/lib/sanitize.ts:
         - <a> forzar rel="noopener noreferrer nofollow" y target="_blank".
         - href solo https:// o mailto:.
         - Asegurar que <img>, <iframe>, <script>, <style>, <object>, <embed> son rechazados.
         - Tests Vitest en src/lib/sanitize.test.ts con payloads XSS comunes.
      4. Actualizar src/lib/queries.ts:
         - getSubjectPageBySlug: incluir playlistUrl, playlistEnabled en select de Subject;
           reemplazar `apuntes.select.pdfObjectKey` por `apuntes.include.recursos: { orderBy: { orden: 'asc' } }`.
           NO postprocesar `hasPdf`.
         - getAdminSubjectBySlug: include recursos también.
         - getSubjectDeleteImpact / getYearDeleteImpact: reemplazar pdfCount por recursosCount.
    archivos_alcance:
      permitidos:
        - src/lib/recursos.ts
        - src/lib/recursos.test.ts
        - src/lib/sanitize.ts
        - src/lib/sanitize.test.ts
        - src/lib/queries.ts
      prohibidos:
        - src/app/
        - src/components/
        - prisma/
    criterio_cierre: |
      - `npx tsc --noEmit` pasa.
      - `pnpm vitest run src/lib/recursos.test.ts src/lib/sanitize.test.ts` pasa.
      - Imports de pdfObjectKey eliminados de queries.ts.
    dependencias: [F1]
    estado: pendiente

  F3:
    nombre: Server actions + cleanup de storage PDF
    dominio: backend
    criticidad: critica
    objetivo: |
      1. src/app/admin/actions.ts:
