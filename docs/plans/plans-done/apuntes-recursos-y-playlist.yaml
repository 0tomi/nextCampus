    - Recursos múltiples ordenables: ApunteRecurso con UNIQUE(apunteId, orden), modal con reorder ↑↓, render en orden. ✓
    - Solo YouTube/Drive: detectarRecurso allowlist por hostname exacto + Zod refine server-side. ✓
    - Iconos por tipo: lucide CirclePlay para YT, logo PNG para Drive. ✓
    - YouTube embed visible: iframe a youtube-nocookie.com con CSP frame-src ampliado. ✓
    - Drive como botón: ApunteRecursoView lo renderiza idéntico al de la materia. ✓
    - Edición de apuntes por admins del año o generales: requireYearAdminForApunteId guard + EditApunteButton. ✓
    - DB reestructurada: Apunte (vacía) drop+recreate sin pdfObjectKey + ApunteRecurso nueva. ✓
    - PK ApunteRecurso: surrogate + UNIQUE(apunteId, orden), orden SMALLINT. ✓
    - Antixss: sanitize endurecido + tests. ✓
    - Validación de permisos en backend: helpers de auth.ts en cada server action. ✓
