           consistente + órdenes únicos, max 50, orden 0..255). Sanitizar descripcionHtml.
           Transacción Prisma: create Apunte + createMany ApunteRecurso. Revalidate paths.
         - Nueva `updateApunteAction`: requireYearAdminForApunteId → Zod → sanitize → tx:
           update apunte + deleteMany recursos + createMany recursos.
         - `deleteApunteAction`: simplificar, sin storage. Solo prisma.apunte.delete (cascada borra recursos).
         - Extender `updateSubjectAction` con playlistUrl + playlistEnabled (validar host YT si url presente).
         - Nueva `updateSubjectPlaylistAction` (espejo de updateSubjectDriveUrlAction).
      2. Eliminar de src/lib/storage.ts: uploadApuntePdf, getApuntePdfUrl, deleteApuntePdf.
         (Mantener las funciones de quiz banks y year/subject storage que no son de PDFs de apuntes.)
      3. Eliminar archivo src/app/api/apuntes/[id]/pdf/route.ts completo.
      4. Si hay imports rotos en otros archivos por funciones eliminadas, ajustar (probablemente solo
         actions.ts que dejará de importar las funciones de PDF).
    archivos_alcance:
