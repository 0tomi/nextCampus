plan: improve-performance
meta:
  objetivo: Ejecutar íntegramente docs/plans/improve_performance.md con cambios quirúrgicos, sin deuda técnica ni cambios de slugs.
  dominio: nextjs + datos + frontend
  creado: 2026-06-10T00:00:00-03:00
  fases_totales: 4
  fuente: docs/plans/improve_performance.md

restricciones:
  R1:
    titulo: Slugs y rutas inmutables
    contenido: No cambiar slugs, rutas ni slugs del mapa.
  R2:
    titulo: Alcance quirúrgico
    contenido: No partir DashboardShell, no fusionar vistas del mapa, no cambiar TTLs ni la semántica de getLatestApuntes.
  R3:
    titulo: Invariantes del mapa
    contenido: Preservar localStorage, evento de sincronización, copy por vista, gate de hidratación e initialMode.
  R4:
    titulo: Verificación y commits
    contenido: Ejecutar typecheck y build por fase, tests al final y un commit convencional por fase sin atribución de IA.

fases:
  F1:
    nombre: Cache Components
    dominio: nextjs + datos
    criticidad: critica
    objetivo: Migrar caching, segment configs y boundaries según la fase 1 del plan fuente.
    dependencias: []
    estado: completada
    cierre:
      archivos_tocados:
        - next.config.ts
        - src/lib/queries.ts
        - src/lib/storage.ts
        - src/app/layout.tsx
        - src/app/**/loading.tsx
        - src/app/**/page.tsx
        - src/app/api/**/route.ts
        - src/app/admin/actions.ts
      supuestos:
        - No existen acciones CRUD de categorías; el tag queda listo para invalidación cuando se incorporen.
      deuda: []
      notas: Build PPR exitoso; segundas visitas a home, materia y apunte ejecutaron cero queries reales. El apunte ejecutó una sola query en cache miss entre metadata y página.
      timestamp: 2026-06-10T00:00:00-03:00
  F2:
    nombre: Upload paralelo
    dominio: backend
    criticidad: estandar
    objetivo: Paralelizar compilación y subida de recursos con un cliente admin por batch.
    dependencias: [F1]
    estado: completada
    cierre:
      archivos_tocados:
        - src/app/admin/actions.ts
        - src/app/admin/actions.test.ts
        - src/lib/supabase/admin.ts
      supuestos: []
      deuda: []
      notas: Promise.all procesa compilación y uploads en paralelo; test prueba resolución fuera de orden y persistencia estable. Create y update comparten el helper.
      timestamp: 2026-06-10T00:00:00-03:00
  F3:
    nombre: Bundle
    dominio: frontend
    criticidad: estandar
    objetivo: Lazy-load de extras del shell, simplificar calendario móvil y borrar assets muertos.
    dependencias: [F2]
    estado: completada
    cierre:
      archivos_tocados:
        - src/components/shell/DashboardShell.tsx
        - src/components/year/YearCalendarView.tsx
        - src/components/mobile/subject/tabs/AgendaTab.tsx
        - src/components/mobile/calendar/MobileCalendarLazy.tsx
        - public/vercel.svg
        - public/next.svg
        - public/file.svg
        - public/globe.svg
        - public/window.svg
      supuestos: []
      deuda: []
      notas: Modal y mascota quedaron en chunks separados; el modal conserva animación de salida tras la primera apertura. React Doctor 100/100.
      timestamp: 2026-06-10T00:00:00-03:00
  F4:
    nombre: Refactor Mapa
    dominio: frontend + dominio
    criticidad: critica
    objetivo: Extraer únicamente la lógica duplicada indicada, preservar invariantes y ampliar tests.
    dependencias: [F3]
    estado: completada
    cierre:
      archivos_tocados:
        - src/lib/domain/mapa/subjectQueries.ts
        - src/lib/domain/mapa/subjectQueries.test.ts
        - src/lib/domain/mapa/correlativasData.ts
        - src/hooks/useSubjectSelection.ts
        - src/hooks/useMapaProgress.ts
        - src/components/mapa/MapaResetDialog.tsx
        - src/components/mapa/MapaCorrelativas.tsx
        - src/components/mapa/MapaCorrelativasMobile.tsx
        - src/components/mapa/MapaVisualCorrelativas.tsx
      supuestos: []
      deuda: []
      notas: Tests de dominio, typecheck, build y smoke desktop/mobile/visual aprobados. Se preservaron slugs, storage key, evento e initialMode.
      timestamp: 2026-06-10T00:00:00-03:00

estado_global:
  estado: completado
  fases:
    F1: completada
    F2: completada
    F3: completada
    F4: completada

auditoria:
  cobertura:
    cache_components: completada
    uploads_paralelos: completada
    bundle: completada
    mapa: completada
  consistencia:
    - No se modificaron slugs ni rutas.
    - Se preservaron TTLs y la semántica de getLatestApuntes.
    - Se preservaron la key, el evento y los modos iniciales del mapa.
  verificacion:
    - pnpm test: 29 suites y 207 tests aprobados.
    - pnpm typecheck: aprobado.
    - pnpm build: aprobado con Cache Components y PPR.
    - React Doctor: sin regresiones aplicables; el único warning es falso positivo por estados independientes según la regla del proyecto.
    - Playwright: desktop, mobile y visual aprobados, incluida persistencia y sincronización entre pestañas.
    - Bundle inicial de DashboardShell en /mapa reducido 20123 bytes respecto de F2.
  deuda: []

