schema: spec-driven

context: |
  Tech stack: Next.js 16.2, React 19.2, Prisma, Supabase, Tailwind CSS v4, PNPM
  Architecture: App Router, RSC, client components for interactive UI
  Testing: Vitest, node_modules/.bin/vitest
  Style: ESLint, TypeScript tsc

strict_tdd: true

testing:
  strict_tdd: true
  test_runner:
    command: "pnpm test"
    framework: "vitest"
  layers:
    unit: true
    integration: true
    e2e: false
  coverage:
    available: false
  quality_tools:
    linter: "pnpm lint"
    type_checker: "pnpm tsc --noEmit"

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include layout diagrams for visual changes
    - Document animation behavior and transitions
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Keep tasks small and focused
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas
