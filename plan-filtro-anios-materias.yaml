  cobertura_objetivo:
    estado: cumplido
    evidencia:
      - "Filtrado de años y materias usando LocalStorage: F1 implementa la capa de storage + hook, F4 aplica el filtro en home desktop y mobile."
      - "Botón en root header: F3 agrega ConfigButton al topbar desktop (DashboardShell) y al header mobile (MobileShell), público (sin AdminControls)."
      - "Página /configurar dedicada: F2 con checkboxes por año + materias anidadas, botones Guardar / Mostrar todo / Cancelar."
      - "Inicio sin contaminar: el único control visible en el home es el botón Configurar del header; toda la config vive en su propia página."
      - "DESIGN.md respetado: surface-0/1, border-white/5, eyebrows uppercase tracking, getYearColorClasses por año, uader-red para acentos primarios, cursor-pointer en clickeables, fuentes Jakarta/Sora."
